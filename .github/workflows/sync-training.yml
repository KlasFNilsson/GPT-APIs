name: Speediance Sync (Training Frequent)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: speediance-sync-training
  cancel-in-progress: false

jobs:
  sync_training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run training sync
        env:
          SPEEDIANCE_REGION: ${{ secrets.SPEEDIANCE_REGION }}
          SPEEDIANCE_DEVICE_TYPE: ${{ secrets.SPEEDIANCE_DEVICE_TYPE }}
          SPEEDIANCE_ALLOW_MONSTER_MOVES: ${{ secrets.SPEEDIANCE_ALLOW_MONSTER_MOVES }}
          SPEEDIANCE_UNIT: ${{ secrets.SPEEDIANCE_UNIT }}
          SPEEDIANCE_TOKEN: ${{ secrets.SPEEDIANCE_TOKEN }}
          SPEEDIANCE_USER_ID: ${{ secrets.SPEEDIANCE_USER_ID }}
          DETAIL_THROTTLE_SECONDS: "2"
          DETAIL_RETRIES: "2"
          MAX_TRAINING_DETAILS: "200"
          TRAINING_DAYS: "365"
        run: |
          python scripts/sync_speediance.py --training-only --skip-library

      - name: Commit generated training data
        run: |
          git config user.name "speediance-mirror-bot"
          git config user.email "actions@users.noreply.github.com"

          test -f data/training_records.json && git add data/training_records.json || true
          test -f data/training_flat.csv && git add data/training_flat.csv || true
          test -f data/training_compact/index.json && git add data/training_compact/index.json || true
          find data/training_compact -maxdepth 1 -type f -name '*.json' ! -name 'index.json' -print0 2>/dev/null | xargs -0 -r git add

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "freq-sync: training"
            git push
          fi

      - name: Push to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
        run: |
          python scripts/push_to_google_sheets.py
